<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Nexa AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {sexy}
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f19;
      color: white;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #222938;
      background: #111827;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      margin-right: 12px;
    }
    .brand h1 {
      font-size: 18px;
    }
    .brand p {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px 120px;
    }
    .message {
      display: flex;
      margin-bottom: 18px;
      max-width: 850px;
      margin-left: auto;
      margin-right: auto;
    }
    .message.user {
      justify-content: flex-end;
    }
    .bubble {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 17px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .assistant .bubble {
      background: #182131;
      border-bottom-left-radius: 5px;
    }
    .user .bubble {
      background: #4f46e5;
      border-bottom-right-radius: 5px;
    }
    .welcome {
      text-align: center;
      max-width: 600px;
      margin: 70px auto 30px;
    }
    .welcome-logo {
      width: 75px;
      height: 75px;
      border-radius: 23px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 36px;
      font-weight: 800;
    }
    .welcome h2 {
      margin-top: 18px;
      font-size: 28px;
    }
    .welcome p {
      margin-top: 8px;
      color: #9ca3af;
      font-size: 15px;
    }
    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 600px;
      margin: 25px auto;
    }
    .suggestion {
      background: #111827;
      border: 1px solid #293244;
      color: #d1d5db;
      padding: 13px;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }
    .suggestion:hover {
      background: #1b2434;
    }
    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: linear-gradient(transparent, #0b0f19 20%);
    }
    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: center;
      background: #111827;
      border: 1px solid #30394b;
      border-radius: 18px;
      padding: 7px;
    }
    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 9px 10px;
      font-size: 15px;
      font-family: inherit;
      max-height: 120px;
    }
    textarea::placeholder {
      color: #6b7280;
    }
    #send {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 13px;
      background: #4f46e5;
      color: white;
      font-size: 19px;
      cursor: pointer;
    }
    .footer-note {
      text-align: center;
      color: #596273;
      font-size: 10px;
      margin-top: 6px;
    }
    @media (max-width: 500px) {
      .welcome {
        margin-top: 45px;
      }
      .welcome h2 {
        font-size: 24px;
      }
      .suggestions {
        grid-template-columns: 1fr;
      }
      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">N</div>
    <div class="brand">
      <h1>Nexa</h1>
      <p>Smart • Friendly • Powerful</p>
    </div>
  </header>
  <main id="chat">
    <div id="welcome" class="welcome">
      <div class="welcome-logo">N</div>
      <h2>Hey, I'm Nexa 👋</h2>
      <p>
        Your smart, friendly AI assistant.
        Ask me anything and let's get started.
      </p>
      <div class="suggestions">
        <button class="suggestion"
          onclick="useSuggestion('Help me understand something')">
          🧠 Explain something
        </button>
        <button class="suggestion"
          onclick="useSuggestion('Help me with my schoolwork')">
          📚 Help with school
        </button>
        <button class="suggestion"
          onclick="useSuggestion('Give me something interesting to learn')">
          🌎 Teach me something
        </button>
        <button class="suggestion"
          onclick="useSuggestion('Tell me a funny joke')">
          😂 Make me laugh
        </button>
      </div>
    </div>
  </main>
  <div class="input-area">
    <div class="input-box">
      <textarea
        id="messageInput"
        rows="1"
        placeholder="Message Nexa..."
        autocomplete="off"></textarea>
      <button id="send" onclick="sendMessage()">➤</button>
    </div>
    <div class="footer-note">
      Nexa is being built step by step.
    </div>
  </div>
</div>
<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const welcome = document.getElementById("welcome");
  function addMessage(text, sender) {
    if (welcome) {
      welcome.style.display = "none";
    }
    const message = document.createElement("div");
    message.className = "message " + sender;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    message.appendChild(bubble);
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
  }
  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";
    setTimeout(() => {
      addMessage(
        "I'm Nexa 👋 I'm still being built! My AI brain will be connected in the next step. 🧠⚡",
        "assistant"
      );
    }, 600);
  }
  function useSuggestion(text) {
    input.value = text;
    input.focus();
  }
  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
